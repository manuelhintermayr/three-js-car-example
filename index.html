<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js + Rapier Car Game</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
                "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/+esm"
            }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="./index.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/info-panel.css">
    <link rel="stylesheet" href="css/mobile-controls.css">
    <link rel="stylesheet" href="css/desktop-controls.css">
    <link rel="stylesheet" href="css/fps-counter.css">
</head>

<body>
    <div id="app">
        <!-- Info Panel Component -->
        <info-panel :speed="speed" :position="position" :rotation="rotation" :direction="direction"
            :collisions="collisions" :knocked-boxes="knockedBoxes" :max-speed="maxSpeed" :race-time="raceTime"
            :is-racing="isRacing" :is-touch-device="isTouchDevice">
        </info-panel>

        <!-- FPS Counter Component -->
        <fps-counter :fps="fps"></fps-counter>

        <!-- Canvas -->
        <canvas id="renderCanvas"></canvas>

        <!-- Desktop Controls Component -->
        <desktop-controls :is-touch-device="isTouchDevice">
        </desktop-controls>

        <!-- Mobile Controls Component -->
        <mobile-controls :is-touch-device="isTouchDevice" @update-touch-controls="onTouchControlsUpdate"
            @reset-game="onMobileReset">
        </mobile-controls>
    </div>
</body>

</html>
